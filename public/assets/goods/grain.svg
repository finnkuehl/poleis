<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Grain: a bound wheat sheaf -->
  <g stroke="#1d2b36" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- stalks below the tie -->
    <path d="M25 36 H39 L47 59 H17 z" fill="#d9b45a"/>
    <path d="M34 38 H39 L47 59 H37 z" fill="#b0793a" stroke="none"/>
    <path d="M25 36 H39 L47 59 H17 z" fill="none"/>
    <path d="M28 42 L25 56 M33 42 L34 56" fill="none" stroke="#b0793a" stroke-width="1.6"/>
    <!-- fan of stalks above the tie -->
    <path d="M25 36 L13 20 H51 L39 36 z" fill="#d9b45a"/>
    <!-- ears, outer ones first -->
    <ellipse cx="18.5" cy="20" rx="4.2" ry="9" transform="rotate(-44 18.5 20)" fill="#e8d29a"/>
    <ellipse cx="45.5" cy="20" rx="4.2" ry="9" transform="rotate(44 45.5 20)" fill="#d9b45a"/>
    <ellipse cx="25" cy="16" rx="4.2" ry="9" transform="rotate(-22 25 16)" fill="#e8d29a"/>
    <ellipse cx="39" cy="16" rx="4.2" ry="9" transform="rotate(22 39 16)" fill="#d9b45a"/>
    <ellipse cx="32" cy="14.5" rx="4.4" ry="9.5" fill="#e8d29a"/>
    <path d="M32 9 V20" fill="none" stroke="#b0793a" stroke-width="1.5"/>
    <!-- tie -->
    <rect x="22" y="32.5" width="20" height="7" rx="2.5" fill="#b5523b"/>
  </g>
</svg>
