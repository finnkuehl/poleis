<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Settler: covered cart with linen canopy and an amphora -->
  <ellipse cx="52" cy="84" rx="30" ry="5" fill="#1d2b36" opacity="0.22"/>
  <g stroke="#1d2b36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- draw pole -->
    <line x1="68" y1="62" x2="85" y2="58" stroke-width="6.5"/>
    <line x1="68" y1="62" x2="85" y2="58" stroke="#8a5a34" stroke-width="3"/>
    <!-- amphora in the open front -->
    <path d="M57 38 Q54 44 58 52" fill="none" stroke-width="2.2"/>
    <path d="M69 38 Q72 44 68 52" fill="none" stroke-width="2.2"/>
    <path d="M60 32 L66 32 L66 38 Q72 44 67 58 L59 58 Q54 44 60 38 Z" fill="#b5523b"/>
    <path d="M65 39 Q70 45 66.5 57 L63.5 57 Q66 46 63 39 Z" fill="#8a3b2a" stroke="none"/>
    <!-- linen canopy -->
    <path d="M14 56 Q13 24 34 23 Q55 24 55 56 Z" fill="#eceee8"/>
    <path d="M42 25 Q55 30 55 56 L46 56 Q48 36 42 25 Z" fill="#c9cdc2" stroke="none"/>
    <path d="M14 56 Q13 24 34 23 Q55 24 55 56 Z" fill="none"/>
    <path d="M27 55 Q26 34 30 24 M41 55 Q42 34 38 24" fill="none" stroke-width="1.6"/>
    <!-- cart bed -->
    <path d="M12 55 L72 55 L70 67 L14 67 Z" fill="#8a5a34"/>
    <path d="M13 62 L71 62 L70 67 L14 67 Z" fill="#5e3b22" stroke="none"/>
    <path d="M12 55 L72 55 L70 67 L14 67 Z" fill="none"/>
    <!-- wheel -->
    <circle cx="40" cy="69" r="13.5" fill="#d9a35a"/>
    <circle cx="40" cy="69" r="8.5" fill="#e8d29a" stroke-width="1.8"/>
    <path d="M40 60.5 L40 77.5 M31.5 69 L48.5 69" fill="none" stroke-width="2"/>
    <circle cx="40" cy="69" r="3" fill="#b0793a" stroke-width="1.8"/>
  </g>
</svg>
