<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Scout: runner with straw petasos hat, flowing cloak and walking staff -->
  <ellipse cx="50" cy="84" rx="24" ry="5" fill="#1d2b36" opacity="0.22"/>
  <g stroke="#1d2b36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- flowing cloak -->
    <path d="M38 37 Q22 40 13 58 L20 59 L17 66 L27 63 Q32 58 38 60 Z" fill="#3e7d6b"/>
    <!-- staff -->
    <line x1="66" y1="22" x2="70" y2="83" stroke-width="6"/>
    <line x1="66" y1="22" x2="70" y2="83" stroke="#8a5a34" stroke-width="2.5"/>
    <!-- running legs -->
    <path d="M34 62 L43 62 L33 79 L35 83 L24 82 L26 76 Z" fill="#e3b98c"/>
    <path d="M45 62 L54 62 L60 78 L64 79 L64 83 L53 83 Z" fill="#e3b98c"/>
    <!-- tunic -->
    <path d="M35 38 L53 38 L57 66 L31 66 Z" fill="#eceee8"/>
    <path d="M48 38 L53 38 L57 66 L50 66 Z" fill="#c9cdc2" stroke="none"/>
    <path d="M35 38 L53 38 L57 66 L31 66 Z" fill="none"/>
    <!-- cloak over the shoulders -->
    <path d="M33 37 L54 37 L56 45 Q45 50 32 46 Z" fill="#3e7d6b"/>
    <circle cx="45" cy="42" r="2" fill="#d9a35a" stroke-width="1.5"/>
    <!-- staff arm -->
    <path d="M53 41 L62 44 L70 47 L69 53 L60 51 L52 47 Z" fill="#e3b98c"/>
    <!-- head and petasos hat -->
    <circle cx="46" cy="28" r="9.5" fill="#e3b98c"/>
    <circle cx="50" cy="30" r="1.4" fill="#1d2b36" stroke="none"/>
    <ellipse cx="46" cy="21" rx="16" ry="4.5" fill="#d9b45a"/>
    <path d="M38 20 Q39 9 46 9 Q53 9 54 20 Z" fill="#d9b45a"/>
    <path d="M38.5 19 Q46 22 53.5 19" fill="none" stroke="#b5523b" stroke-width="2"/>
  </g>
</svg>
