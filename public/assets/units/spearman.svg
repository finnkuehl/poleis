<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Spearman: light infantry, tall spear, small round shield, pilos cap -->
  <ellipse cx="54" cy="84" rx="22" ry="5" fill="#1d2b36" opacity="0.22"/>
  <g stroke="#1d2b36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- spear -->
    <line x1="64" y1="83" x2="68" y2="22" stroke-width="6"/>
    <line x1="64" y1="83" x2="68" y2="22" stroke="#8a5a34" stroke-width="2.5"/>
    <path d="M69 10 L72.5 22.5 L64.5 22 Z" fill="#eceee8"/>
    <!-- bare legs -->
    <path d="M39 64 h7 v15 h3 v4 h-10 Z" fill="#e3b98c"/>
    <path d="M50 64 h7 v15 h3 v4 h-10 Z" fill="#e3b98c"/>
    <!-- linen tunic -->
    <path d="M37 38 L58 38 L62 68 L33 68 Z" fill="#eceee8"/>
    <path d="M52 38 L58 38 L62 68 L54 68 Z" fill="#c9cdc2" stroke="none"/>
    <path d="M37 38 L58 38 L62 68 L33 68 Z" fill="none"/>
    <path d="M35.5 52 L60 52" fill="none" stroke="#b5523b" stroke-width="4"/>
    <!-- spear arm -->
    <path d="M56 40 L63 45 L68 49 L66 54 L60 52 L54 47 Z" fill="#e3b98c"/>
    <!-- head and pilos cap -->
    <circle cx="48" cy="28" r="9.5" fill="#e3b98c"/>
    <circle cx="52" cy="30" r="1.4" fill="#1d2b36" stroke="none"/>
    <path d="M36 26 Q39 9 48 8 Q57 9 60 26 Z" fill="#b0793a"/>
    <path d="M42 21 Q43 14 47 12" fill="none" stroke="#d9a35a" stroke-width="2.5"/>
    <!-- small shield -->
    <circle cx="35" cy="55" r="11.5" fill="#b0793a"/>
    <circle cx="34.5" cy="54.5" r="6" fill="#d9a35a" stroke-width="1.6"/>
  </g>
</svg>
