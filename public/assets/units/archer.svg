  <g stroke="#1d2b36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- quiver -->
    <path d="M19 31 L27 28 L33 52 L25 55 Z" fill="#8a5a34"/>
    <path d="M20 26 L21 21 M24 25 L24 19 M27 24 L29 19" fill="none" stroke-width="2"/>
    <!-- legs -->
    <path d="M30 64 L38 64 L36 79 L39 79 L39 83 L27 83 Z" fill="#e3b98c"/>
    <path d="M42 64 L50 64 L53 79 L57 79 L57 83 L46 83 Z" fill="#e3b98c"/>
