    <path d="M30 38 L50 38 L54 68 L26 68 Z" fill="#6f7d3a"/>
    <path d="M45 38 L50 38 L54 68 L47 68 Z" fill="#4a5a26" stroke="none"/>
    <path d="M30 38 L50 38 L54 68 L26 68 Z" fill="none"/>
    <path d="M28.5 54 L52 54" fill="none" stroke="#8a5a34" stroke-width="3.5"/>
