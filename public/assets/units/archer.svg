    <path d="M47 43 L47 49 L30 50 L25 45 L29 41 Z" fill="#e3b98c"/>
    <!-- head -->
    <circle cx="41" cy="27" r="9.5" fill="#e3b98c"/>
    <path d="M31.5 28 Q30 16 41 16 Q50 16 51 24 Q44 20 38 23 Q37 27 33 31 Z" fill="#5e3b22"/>
    <circle cx="46" cy="28" r="1.4" fill="#1d2b36" stroke="none"/>
