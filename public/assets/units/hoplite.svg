<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Hoplite: crested Corinthian helmet, large bronze aspis, spear -->
  <ellipse cx="54" cy="84" rx="24" ry="5" fill="#1d2b36" opacity="0.22"/>
  <g stroke="#1d2b36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- spear -->
    <line x1="68" y1="20" x2="68" y2="83" stroke-width="6"/>
    <line x1="68" y1="20" x2="68" y2="83" stroke="#8a5a34" stroke-width="2.5"/>
    <path d="M68 9 L72 21 L64 21 Z" fill="#eceee8"/>
    <!-- legs with bronze greaves -->
    <path d="M39 66 h7 v13 h3 v4 h-10 Z" fill="#b0793a"/>
    <path d="M51 66 h7 v13 h3 v4 h-10 Z" fill="#b0793a"/>
    <!-- linen skirt and bronze cuirass -->
    <path d="M35 56 L61 56 L64 71 L33 71 Z" fill="#eceee8"/>
    <path d="M55 56 L61 56 L64 71 L56 71 Z" fill="#c9cdc2" stroke="none"/>
    <path d="M35 56 L61 56 L64 71 L33 71 Z" fill="none"/>
    <path d="M37 38 L61 38 Q64 48 62 59 L36 59 Q34 48 37 38 Z" fill="#b0793a"/>
    <!-- spear arm -->
    <path d="M58 40 L66 45 L71 49 L69 54 L62 52 L56 47 Z" fill="#e3b98c"/>
    <!-- crest -->
    <path d="M65 21 Q56 1 39 7 Q25 14 28 39 L39 37 L42 20 Z" fill="#b5523b"/>
    <path d="M34 13 L41 20 M46 6 L47 16 M57 10 L53 17 M29 25 L38 27" fill="none" stroke="#8a3b2a" stroke-width="1.8"/>
    <!-- Corinthian helmet -->
    <path d="M40 43 L40 30 Q40 18 51 18 Q63 18 63 30 L63 41 L57 45 L50 45 Z" fill="#b0793a"/>
    <path d="M44 29 Q45 23 50 21.5" fill="none" stroke="#d9a35a" stroke-width="2.5"/>
    <path d="M50 31 L61.5 31 M56 31 L56 43.5" fill="none" stroke-width="3.6"/>
    <!-- aspis shield -->
    <circle cx="40" cy="58" r="18" fill="#b0793a"/>
    <path d="M52.7 45.3 A18 18 0 0 1 27.3 70.7 A25 25 0 0 0 52.7 45.3 Z" fill="#8a5a34" stroke="none" opacity="0.75"/>
    <circle cx="40" cy="58" r="18" fill="none"/>
    <circle cx="39" cy="57" r="11" fill="#d9a35a" stroke-width="1.6"/>
    <circle cx="39" cy="57" r="3.5" fill="#b0793a" stroke-width="1.6"/>
  </g>
</svg>
