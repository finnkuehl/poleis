<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Poleis art gallery</title>
    <style>
      /* Dev-only review page for the drawn assets (see docs/ART.md). */
      body {
        margin: 0;
        padding: 12px;
        background: #dfe3da;
        color: #1d2b36;
        font:
          14px system-ui,
          sans-serif;
      }
      h1 {
        margin: 4px 0 2px;
        font:
          600 22px Palatino,
          Georgia,
          serif;
      }
      h2 {
        margin: 22px 0 8px;
        font:
          600 18px Palatino,
          Georgia,
          serif;
      }
      p {
        margin: 0 0 8px;
        color: #4b5b66;
      }
      .asset {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        border-top: 1px solid #c9cdc2;
      }
      .asset-id {
        width: 104px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .asset-id small {
        display: block;
        color: #9e3b34;
        font-weight: 400;
      }
      /* One background strip (marble or sea) with the asset at 20, 40 and 96 px. */
      .strip {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border-radius: 10px;
      }
      .strip.marble {
        background: #eceee8;
        border: 1px solid #d5d9d0;
      }
      .strip.sea {
        background: #163545;
        border: 1px solid #163545;
      }
      .strip img,
      .token img,
      .based img {
        display: block;
      }
      /* Shown instead of an image whose file does not exist yet. */
      .missing {
        display: block;
        box-sizing: border-box;
        border: 1.5px dashed #a9b0a6;
        border-radius: 4px;
        background: repeating-linear-gradient(
          45deg,
          rgba(169, 176, 166, 0.18) 0 4px,
          rgba(169, 176, 166, 0.36) 4px 8px
        );
      }
      /* Units: a round token in the player color, like a board-game piece. */
      .token {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 2.5px solid #1d2b36;
        box-shadow: 2px 3px 0 rgba(29, 43, 54, 0.25);
      }
      /* Buildings: a miniature standing on a small round base in the player color. */
      .based {
        position: relative;
        width: 72px;
        height: 72px;
      }
      .based::before {
        content: '';
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: 2px;
        height: 24px;
        border-radius: 50%;
        background: var(--player);
        border: 2px solid #1d2b36;
      }
      .based img,
      .based .missing {
        position: relative;
      }
      .map-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 10px;
        background: #9cc25a;
      }
    </style>
  </head>
  <body>
    <div id="gallery"></div>
    <script type="module" src="/src/artPreview.ts"></script>
  </body>
</html>
