<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Poleis UI preview</title>
    <style>
      body {
        background: linear-gradient(160deg, #a9b665 0%, #3d8ea3 70%);

        z-index: 1;

      #preview-controls button {
        flex: none;
        min-height: 44px;
        padding: 0 10px;
        font:

          sans-serif;
      }

    <div id="app"></div>
    <div id="preview-controls"></div>
    <div id="ui"></div>
    <script type="module" src="/src/ui/preview.ts"></script>
