# Veröffentlicht das Spiel bei jedem Push auf main auf GitHub Pages.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechte, die Pages zum Veröffentlichen braucht
permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur ein Deploy gleichzeitig; laufende werden nicht abgebrochen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Code holen
      - uses: actions/checkout@v5
      # Node.js einrichten (Version aus .nvmrc)
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Abhängigkeiten installieren
      - run: npm ci
      # Produktionsversion nach dist/ bauen
      - run: npm run build
      # Pages für den Upload vorbereiten
      - uses: actions/configure-pages@v5
      # dist/ als Pages-Artefakt hochladen
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Artefakt auf GitHub Pages veröffentlichen
      - id: deployment
        uses: actions/deploy-pages@v4
