# Publishes the game to GitHub Pages on every push to main.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions Pages needs to publish
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; running ones are not cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Fetch the code
      - uses: actions/checkout@v5
      # Set up Node.js (version from .nvmrc)
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Install dependencies
      - run: npm ci
      # Build the production version into dist/
      - run: npm run build
      # Prepare Pages for the upload
      - uses: actions/configure-pages@v5
      # Upload dist/ as a Pages artifact
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Publish the artifact to GitHub Pages
      - id: deployment
        uses: actions/deploy-pages@v4
