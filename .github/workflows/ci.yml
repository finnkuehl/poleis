# Checks on every push that the project is in good shape.
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Fetch the code from the repository
      - uses: actions/checkout@v5
      # Set up Node.js in the version from .nvmrc (the npm cache speeds it up)
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Install dependencies exactly as in package-lock.json
      - run: npm ci
      # Check TypeScript types
      - run: npm run typecheck
      # Check code style and architecture rules
      - run: npm run lint
      # Run unit tests
      - run: npm test
      # Make sure the game can be built
      - run: npm run build
